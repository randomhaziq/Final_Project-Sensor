<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your registered IoT environmental safety devices and status handshakes.">
    <title>Environmental Device Manager</title>
    <!-- Google Fonts Outfit & Inter -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-base: #060a13;
            --bg-surface: #0c1322;
            --bg-card: rgba(16, 25, 44, 0.65);
            --border-default: rgba(255, 255, 255, 0.06);
            --text-primary: #f8fafc;
            --text-secondary: #64748b;

            --color-indigo: #6366f1;
            --color-cyan: #06b6d4;
            --glow-indigo: rgba(99, 102, 241, 0.25);
            --color-emerald: #10b981;
            --color-rose: #f43f5e;
            --color-amber: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
            background-image: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.07) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* HEADER SECTION */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 28px;
            background: linear-gradient(135deg, #0e172a, #0b1120);
            border: 1px solid var(--border-default);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .header-title-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .system-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--color-indigo), var(--color-cyan));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .system-logo svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .header-text h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-text p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--color-rose);
            color: var(--color-rose);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: rgba(244, 63, 94, 0.08);
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.15);
        }

        /* CONTENT COLUMNS GRID */
        .layout-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }

        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .panel-heading {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-default);
            padding-bottom: 12px;
        }

        .panel-heading h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-heading h2 svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--color-indigo);
            stroke-width: 2;
        }

        /* DEVICES GRID LIST */
        .devices-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .device-row-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-default);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
        }

        .device-row-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
            background: rgba(15, 23, 42, 0.6);
            transform: translateY(-2px);
        }

        .device-info-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .device-header-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .device-header-row h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
        }

        .device-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .device-status-dot.online {
            background-color: var(--color-emerald);
            box-shadow: 0 0 8px var(--color-emerald);
        }

        .device-status-dot.offline {
            background-color: var(--color-rose);
            box-shadow: 0 0 8px var(--color-rose);
        }

        .device-id-code {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .device-id-code code {
            color: var(--color-indigo);
            font-weight: 600;
        }

        .device-thresholds-summary {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            display: flex;
            gap: 14px;
        }

        .device-actions-col {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-view {
            background: var(--color-indigo);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-view:hover {
            background: #4f46e5;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transform: translateY(-1px);
        }

        .btn-delete {
            background: transparent;
            border: 1px solid rgba(244, 63, 94, 0.2);
            color: var(--color-rose);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-delete:hover {
            background: rgba(244, 63, 94, 0.08);
            border-color: var(--color-rose);
        }

        .btn-delete svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* FORM PANEL */
        .form-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-default);
            border-radius: 10px;
            padding: 11px 14px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            border-color: var(--color-indigo);
            box-shadow: 0 0 12px var(--glow-indigo);
            background: rgba(15, 23, 42, 0.7);
        }

        .btn-gradient {
            background: linear-gradient(135deg, var(--color-indigo), #4f46e5);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.15);
        }

        .btn-gradient:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
            transform: translateY(-1px);
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            padding: 14px 28px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(180%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10000;
            font-size: 13px;
            font-weight: 600;
        }

        .toast.show {
            transform: translateY(0);
        }

        .toast.success {
            border-left: 4px solid var(--color-emerald);
            color: var(--text-primary);
        }

        .toast.error {
            border-left: 4px solid var(--color-rose);
            color: var(--text-primary);
        }

        /* Sidebar Drawer Styling */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: rgba(12, 19, 34, 0.98);
            border-right: 1px solid var(--border-default);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10000;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 9999;
        }

        .sidebar-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-family: 'Outfit', sans-serif;
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .sidebar-close-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 26px;
            cursor: pointer;
            line-height: 1;
            transition: color 0.3s;
        }

        .sidebar-close-btn:hover {
            color: white;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            border-radius: 10px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            color: white;
            background: rgba(99, 102, 241, 0.08);
            box-shadow: inset 3px 0 0 var(--color-indigo);
        }
    </style>
</head>

<body>

    <!-- SIDEBAR NAVIGATION DRAWER -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar(false)"></div>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Environmental IoT Gateway</span>
            <button class="sidebar-close-btn" onclick="toggleSidebar(false)">×</button>
        </div>
        <nav class="sidebar-nav">
            <a href="/devices" class="sidebar-link active">
                <svg viewBox="0 0 24 24"
                    style="width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2;">
                    <rect x="2" y="2" width="20" height="8" rx="2" />
                    <rect x="2" y="14" width="20" height="8" rx="2" />
                </svg>
                Manage Devices
            </a>
            <a href="#" onclick="confirmLogout(event)" class="sidebar-link">
                <svg viewBox="0 0 24 24"
                    style="width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2;">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
                </svg>
                Logout
            </a>
        </nav>
    </div>

    <div class="container">

        <!-- HEADER -->
        <header>
            <div style="display: flex; align-items: center; gap: 16px;">
                <!-- Sidebar trigger button -->
                <button class="hamburger-btn" onclick="toggleSidebar(true)"
                    style="background: transparent; border: 1px solid var(--border-default); border-radius: 10px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; color: white; margin-right: 4px;">
                    <svg viewBox="0 0 24 24"
                        style="width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.5;">
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>

                <div class="header-title-container">
                    <div class="system-logo">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12 2L2 22h20L12 2zm0 3.99L19.53 19H4.47L12 5.99zM13 16h-2v2h2v-2zm0-6h-2v4h2v-4z" />
                        </svg>
                    </div>
                    <div class="header-text">
                        <h1>Environmental Device Manager</h1>
                        <p>Welcome back, <strong style="color: white;">{{ username }}</strong></p>
                    </div>
                </div>
            </div>
        </header>

        <!-- LAYOUT GRID -->
        <div class="layout-grid">

            <!-- LEFT COLUMN: REGISTERED DEVICES LIST -->
            <div class="glass-card">
                <div class="panel-heading">
                    <h2>
                        <svg viewBox="0 0 24 24">
                            <rect x="2" y="2" width="20" height="8" rx="2" />
                            <rect x="2" y="14" width="20" height="8" rx="2" />
                            <line x1="6" y1="6" x2="6.01" y2="6" />
                            <line x1="6" y1="18" x2="6.01" y2="18" />
                        </svg>
                        Your Registered Devices
                    </h2>
                </div>

                <div id="devices-container" class="devices-list">
                    <p style="text-align: center; color: var(--text-secondary); padding: 32px 0;">Acquiring devices
                        profiles...</p>
                </div>
            </div>

            <!-- RIGHT COLUMN: ADD NEW DEVICE -->
            <div class="glass-card" style="display: flex; flex-direction: column;">
                <div class="panel-heading">
                    <h2>
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" y1="8" x2="12" y2="16" />
                            <line x1="8" y1="12" x2="16" y2="12" />
                        </svg>
                        Add New Device
                    </h2>
                </div>

                <form id="add-device-form" class="form-panel" onsubmit="addDevice(event)" style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px;">
                    <div class="input-group" style="display: flex; flex-direction: column; gap: 6px;">
                        <label for="device_name">Display Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="device_name" placeholder="e.g. Room ESP32" required>
                        </div>
                    </div>
                    
                    <div class="input-group" style="display: flex; flex-direction: column; gap: 6px;">
                        <label for="device_suffix">Device ID Suffix</label>
                        <div class="input-wrapper" style="display: flex; align-items: center; background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border-default); border-radius: 10px; padding: 0 14px;">
                            <span style="color: var(--text-secondary); font-weight: 700; font-size: 14px; margin-right: 2px; user-select: none;">ESP32_</span>
                            <input type="text" id="device_suffix" placeholder="Env_Monitor" required style="width: 100%; background: transparent; border: none; padding: 11px 0; color: var(--text-primary); font-size: 14px; outline: none;" oninput="this.value = this.value.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_]/g, '')">
                        </div>
                        <p style="font-size: 10px; color: var(--text-secondary); margin-top: 4px; line-height: 1.4;">Must match the <code>device_id</code> sent by your ESP32 hardware client sketch.</p>
                    </div>

                    <button type="submit" class="btn-gradient" style="margin-top: 4px;">Register Device</button>
                </form>
            </div>

        </div>

    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">
        <span id="toast-message">Operation successful</span>
    </div>

    <script>
        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            msgEl.textContent = message;
            toast.className = 'toast show ' + (isSuccess ? 'success' : 'error');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function confirmLogout(event) {
            if (event) event.preventDefault();
            if (confirm("Are you sure you want to logout?")) {
                window.location.href = '/logout';
            }
        }

        function toggleSidebar(open) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (open) {
                sidebar.classList.add('open');
                overlay.classList.add('open');
            } else {
                sidebar.classList.remove('open');
                overlay.classList.remove('open');
            }
        }

        // Fetch and load registered devices list
        async function loadDevices() {
            const container = document.getElementById('devices-container');

            try {
                const res = await fetch('/api/devices');
                const devices = await res.json();

                if (res.status !== 200) {
                    container.innerHTML = `<p style="text-align: center; color: var(--color-rose); padding: 32px 0;">Error fetching devices</p>`;
                    return;
                }

                if (devices.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; color: var(--text-secondary); padding: 48px 0; display: flex; flex-direction: column; gap: 12px; align-items: center;">
                            <svg viewBox="0 0 24 24" style="width: 48px; height: 48px; stroke: var(--text-muted); fill: none; stroke-width: 1.5;">
                                <circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/>
                            </svg>
                            <p style="font-size: 14px;">No devices registered yet. Enter details on the right to add your first node!</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                devices.forEach(dev => {
                    const isOnline = dev.wifi_status === 'Connected';

                    html += `
                        <div class="device-row-card">
                            <div class="device-info-col">
                                <div class="device-header-row">
                                    <span class="device-status-dot ${isOnline ? 'online' : 'offline'}"></span>
                                    <h3>${dev.device_name}</h3>
                                </div>
                                <span class="device-id-code">ID: <code>${dev.device_id}</code></span>
                                <div class="device-thresholds-summary">
                                    <span>Temp Threshold: <strong>${dev.temp_threshold}°C</strong></span>
                                    <span>Gas Threshold: <strong>${dev.gas_threshold} ADC</strong></span>
                                    <span>Interval: <strong>${dev.upload_interval}s</strong></span>
                                </div>
                            </div>
                            
                            <div class="device-actions-col">
                                <button class="btn-view" onclick="openDashboard('${dev.device_id}')">Open Dashboard</button>
                                <button class="btn-delete" onclick="deleteDevice('${dev.device_id}')" title="Delete Device">
                                    <svg viewBox="0 0 24 24">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                        <line x1="10" y1="11" x2="10" y2="17"></line>
                                        <line x1="14" y1="11" x2="14" y2="17"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;

            } catch (err) {
                console.error("Fetch devices error: ", err);
                container.innerHTML = `<p style="text-align: center; color: var(--color-rose); padding: 32px 0;">Connection failed</p>`;
            }
        }

        // Open specific device dashboard
        function openDashboard(deviceId) {
            window.location.href = `/dashboard?device_id=${deviceId}`;
        }

        // Add a device
        async function addDevice(event) {
            event.preventDefault();
            const nameVal = document.getElementById('device_name').value;
            const suffixVal = document.getElementById('device_suffix').value;

            try {
                const res = await fetch('/api/devices/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        device_name: nameVal,
                        device_suffix: suffixVal
                    })
                });

                const data = await res.json();
                if (res.status === 200) {
                    showToast(`Device Registered! ID: ${data.device_id}`, true);
                    document.getElementById('add-device-form').reset();
                    loadDevices();
                } else {
                    showToast(data.message || 'Error registering device', false);
                }
            } catch (err) {
                console.error("Add device error: ", err);
                showToast('Failed to connect to gateway server', false);
            }
        }

        // Delete device
        async function deleteDevice(deviceId) {
            if (!confirm(`Are you sure you want to delete device ${deviceId}? This will delete all logged sensor data as well.`)) {
                return;
            }

            try {
                const res = await fetch('/api/devices/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ device_id: deviceId })
                });

                const data = await res.json();
                if (res.status === 200) {
                    showToast(data.message);
                    loadDevices();
                } else {
                    showToast(data.message || 'Error deleting device', false);
                }
            } catch (err) {
                console.error("Delete device error: ", err);
                showToast('Connection failed', false);
            }
        }

        // Page load init
        document.addEventListener("DOMContentLoaded", () => {
            loadDevices();
        });
    </script>
</body>

</html>

</html>
