<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Access the environmental safety control center. Login or register a new administrator account.">
    <title>Gateway Safety Control - Authentication</title>
    <!-- Google Fonts Outfit & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060a13;
            --bg-surface: #0c1322;
            --bg-card: rgba(16, 25, 44, 0.65);
            --border-default: rgba(255, 255, 255, 0.06);
            --text-primary: #f8fafc;
            --text-secondary: #64748b;
            --color-indigo: #6366f1;
            --color-cyan: #06b6d4;
            --glow-indigo: rgba(99, 102, 241, 0.25);
            --color-rose: #f43f5e;
            --color-emerald: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.07) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.07) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        /* Pulse Logo */
        .auth-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--color-indigo), var(--color-cyan));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .auth-logo svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .auth-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .auth-header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Toggle switcher tabs */
        .tabs-selector {
            display: flex;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-default);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 28px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--color-indigo);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        /* Form styling */
        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-default);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            border-color: var(--color-indigo);
            box-shadow: 0 0 12px var(--glow-indigo);
            background: rgba(15, 23, 42, 0.8);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--color-indigo), #4f46e5);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.15);
        }

        .btn-submit:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* TOAST NOTIFICATION */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            padding: 14px 28px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(180%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10000;
            font-size: 13px;
            font-weight: 600;
        }

        .toast.show {
            transform: translateY(0);
        }

        .toast.success { border-left: 4px solid var(--color-emerald); color: var(--text-primary); }
        .toast.error { border-left: 4px solid var(--color-rose); color: var(--text-primary); }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <!-- HEADER -->
        <div class="auth-header">
            <div class="auth-logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 22h20L12 2zm0 3.99L19.53 19H4.47L12 5.99zM13 16h-2v2h2v-2zm0-6h-2v4h2v-4z"/>
                </svg>
            </div>
            <h1 id="auth-title">Welcome Back</h1>
            <p id="auth-subtitle">Login to enter the safety gateway cockpit</p>
        </div>

        <!-- SELECTOR TABS -->
        <div class="tabs-selector">
            <button id="login-tab" class="tab-btn active" onclick="switchTab('login')">Sign In</button>
            <button id="register-tab" class="tab-btn" onclick="switchTab('register')">Register</button>
        </div>

        <!-- FORM -->
        <form id="auth-form" onsubmit="handleAuth(event)">
            <input type="hidden" id="action-type" value="login">

            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="e.g. admin" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 48px;">
                    <button type="button" id="toggle-password-btn" onclick="togglePasswordVisibility()" style="position: absolute; right: 14px; background: none; border: none; cursor: pointer; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; padding: 0; outline: none; transition: color 0.2s;">
                        <svg id="eye-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="btn-submit">Sign In</button>
        </form>

    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">
        <span id="toast-message">Authentication complete</span>
    </div>

    <script>
        let currentMode = 'login';

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
                document.getElementById('toggle-password-btn').style.color = 'var(--color-indigo)';
            } else {
                pwdInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
                document.getElementById('toggle-password-btn').style.color = 'var(--text-secondary)';
            }
        }

        function switchTab(mode) {
            currentMode = mode;
            
            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const btn = document.getElementById('submit-btn');
            const action = document.getElementById('action-type');

            if (mode === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                title.textContent = 'Welcome Back';
                subtitle.textContent = 'Login to enter the safety gateway cockpit';
                btn.textContent = 'Sign In';
                action.value = 'login';
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                title.textContent = 'Create Profile';
                subtitle.textContent = 'Register a new administrator account';
                btn.textContent = 'Create Account';
                action.value = 'register';
            }
        }

        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            msgEl.textContent = message;
            toast.className = 'toast show ' + (isSuccess ? 'success' : 'error');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        async function handleAuth(event) {
            event.preventDefault();

            const actionVal = document.getElementById('action-type').value;
            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: actionVal,
                        username: usernameVal,
                        password: passwordVal
                    })
                });

                const data = await res.json();

                if (res.status === 200) {
                    showToast(data.message, true);
                    if (actionVal === 'register') {
                        setTimeout(() => {
                            switchTab('login');
                            document.getElementById('password').value = '';
                        }, 1500);
                    } else {
                        setTimeout(() => {
                            window.location.href = '/devices';
                        }, 1000);
                    }
                } else {
                    showToast(data.message || 'Authentication error', false);
                }
            } catch (err) {
                console.error("Auth request error: ", err);
                showToast('Failed to connect to gateway server', false);
            }
        }
    </script>
</body>
</html>
